<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>名刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="meishi.css">
</head>
<body>
<div class="wrap" id="app">
  <header class="hero">
    <div class="role" id="role" hidden></div>
    <div class="name" id="name">名刺</div>
    <p class="msg" id="msg" hidden></p>
  </header>
  <div class="links" id="links"></div>
  <button class="btn btn-main" type="button" id="vcf" hidden>連絡先に保存</button>
  <p class="made"><a href="./">自分のQR名刺もつくる（無料）</a></p>
</div>
<script src="common.js"></script>
<script>
(function () {
  var p = new URLSearchParams(location.search).get("d");
  var d = p ? Meishi.decode(p) : null;
  var links = document.getElementById("links");
  if (!d || !d.n) {
    document.getElementById("name").textContent = "名刺が見つかりません";
    links.innerHTML = '<p class="note">QRコードをもう一度読み取ってみてください。</p>';
    return;
  }
  document.title = d.n + "の名刺";
  document.getElementById("name").textContent = d.n;
  if (d.r) { var r = document.getElementById("role"); r.textContent = d.r; r.hidden = false; }
  if (d.m) { var m = document.getElementById("msg"); m.textContent = d.m; m.hidden = false; }

  function add(href, title, sub) {
    var a = document.createElement("a");
    a.className = "lk"; a.href = href;
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    var s = document.createElement("span"); s.textContent = title;
    var sm = document.createElement("small"); sm.textContent = sub; s.appendChild(sm);
    var g = document.createElement("span"); g.className = "go"; g.textContent = "→"; g.setAttribute("aria-hidden", "true");
    a.appendChild(s); a.appendChild(g); links.appendChild(a);
  }
  var i = Meishi.handle(d.i), x = Meishi.handle(d.x), l = Meishi.safeUrl(d.l), w = Meishi.safeUrl(d.w), t = Meishi.tel(d.t);
  if (i) add("https://www.instagram.com/" + i + "/", "Instagram", "@" + i);
  if (x) add("https://x.com/" + x, "X（旧Twitter）", "@" + x);
  if (l) add(l, "LINE", "友だち追加");
  if (w) add(w, "ホームページ", w.replace(/^https?:\/\//, "").replace(/\/$/, ""));
  if (d.e) add("mailto:" + encodeURIComponent(d.e).replace("%40", "@"), "メール", d.e);
  if (t) add("tel:" + t, "電話", t);

  if (t || d.e) {
    var b = document.getElementById("vcf"); b.hidden = false;
    b.addEventListener("click", function () {
      var blob = new Blob([Meishi.vcard(d)], { type: "text/vcard;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = (d.n || "meishi") + ".vcf";
      document.body.appendChild(a); a.click(); a.remove();
    });
  }
})();
</script>
</body>
</html>
